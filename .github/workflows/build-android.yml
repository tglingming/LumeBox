# Android APK 构建与发布（LumeiXiang 安卓衍生版）。
#
# 触发规则：手动触发（Actions → Build Android APK (LumeiXiang) → Run workflow）。
# 可选输入 create_release：勾选后自动创建 GitHub Release 并附上全部 APK。
name: Build Android APK (LumeiXiang)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建后创建 GitHub Release 并附 APK'
        type: boolean
        default: true

run-name: Build Android APK 1.0.2 (run ${{ github.run_number }})

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 与已提交的 pubspec.lock 来源一致（上游 iOS 流水线同款镜像）。
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: 环境版本
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get --enforce-lockfile

      # intro 模型资产（mobileclip_s0_image.zip / compact_checksums.json）
      # 未入库：脚本从 legacy 包离线重打包并校验（无网络下载，已有文件直接复用）。
      - name: 准备并校验片头识别模型
        run: python3 tool/prepare_intro_models.py

      # 整包（全 ABI），便于直接侧载安装。
      - name: 构建 Release APK（整包）
        run: |
          flutter build apk --release \
            --build-name=1.0.2 \
            --build-number=${{ github.run_number }}

      # 分 ABI 包：arm64 体积只有整包的一半弱，S24U 等纯 64 位机型优先用。
      - name: 构建 Release APK（分 ABI）
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=1.0.2 \
            --build-number=${{ github.run_number }}

      - name: 整理产物
        run: |
          set -euo pipefail
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/LumeiXiang-1.0.2-all.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/LumeiXiang-1.0.2-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/LumeiXiang-1.0.2-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk out/LumeiXiang-1.0.2-x86_64.apk
          ls -lh out/

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumeiXiang-1.0.2-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布 GitHub Release
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-build.${{ github.run_number }}
          name: LumeiXiang 1.0.2（构建 ${{ github.run_number }}）
          body: |
            LumeiXiang（LumeBox 安卓衍生版）1.0.2 构建。

            - 整包 `LumeiXiang-1.0.2-all.apk`：全机型通用
            - `LumeiXiang-1.0.2-arm64.apk`：主流 64 位机型（S24U 等）推荐，体积最小

            基于 [teng662858/LumeBox](https://github.com/teng662858/LumeBox) 上游 254 提交同步 +
            Android 全量适配（图源引擎解锁、MPV 播放内核、性能优化、通道补齐）。
            使用 debug 签名打包，仅限侧载安装测试。
          draft: false
          prerelease: false
          files: out/*.apk
